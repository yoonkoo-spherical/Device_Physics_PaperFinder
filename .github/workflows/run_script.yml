name: Daily Device Physics Paper Search

on:
  schedule:
    - cron: '0 16 * * *' # 매일 UTC 16시 (한국 시간 오전 1시) 실행
  workflow_dispatch: # 필요시 수동으로 실행하기 위한 옵션

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install google-generativeai

      - name: Run search_papers.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python search_papers.py

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add papers_log.md
          git commit -m "Auto-update: Daily paper search results" || echo "No changes to commit"
          git push
